<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Glass on TV</title>
<!-- Serve over http (file:// blocks modules): npm run build && python3 -m http.server, then open /demo/tv.html -->
<link rel="stylesheet" href="../src/glass.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { font: 500 28px/1.3 system-ui, sans-serif; color: #fff; background: #0b0b12 center / cover no-repeat fixed; }
  .light body { color: #17161c; }
  .bar { position: absolute; top: 60px; left: 96px; right: 96px; height: 96px; border-radius: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; box-sizing: border-box; }
  .bar b { font-size: 40px; }
  .shelf { position: absolute; left: 96px; right: 96px; bottom: 260px; display: flex; gap: 40px; }
  .tile { flex: 1; height: 280px; border-radius: 28px; display: grid; place-items: center; }
  .tile canvas { width: 120px; height: 120px; border-radius: 20px; }
  .tile.focus { outline: 6px solid #fff; outline-offset: 8px; }
  .light .tile.focus { outline-color: #17161c; }
  .panel { position: absolute; left: 96px; right: 96px; bottom: 48px; display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center; padding: 24px 32px; border-radius: 20px; background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 22px; }
  .panel label { display: flex; gap: 12px; align-items: center; }
  .panel input[type=range] { width: 320px; }
  .panel output { font-variant-numeric: tabular-nums; min-width: 9ch; }
</style>
</head>
<body>
  <div class="bar glass glass--realistic"><b>Free My TV</b><span id="clock"></span></div>
  <div class="shelf" id="shelf"></div>
  <div class="panel">
    <label><input type="checkbox" id="baked" checked> TV path: baked, no backdrop-filter</label>
    <label><input type="checkbox" id="light"> Light theme</label>
    <label>Scale <input type="range" id="scale" min="1" max="3" step="0.5" value="2.5"><output id="scaleOut"></output></label>
    <label>Time, 27 Oct 2026 <input type="range" id="time" min="0" max="1425" step="15" value="1170"><output id="timeOut"></output></label>
    <label>You look <select id="view"><option value="272">272° W (screen faces east)</option><option value="92">92° E (screen faces west)</option></select></label>
  </div>

<script type="module">
  import { glass, glare, bake, tintFrom } from '../dist/src/index.js'

  const $ = id => document.getElementById(id)
  const root = document.documentElement
  const YAR = { latitude: 57.63, longitude: 39.88 }
  const DAY = Date.UTC(2026, 9, 26, 21, 0) // 27 Oct 2026, 00:00 Moscow

  // Sharp backdrop with detail to frost: sky, sun or moon, hills, a few window lights
  function scene(light) {
    const c = Object.assign(document.createElement('canvas'), { width: 1920, height: 1080 })
    const g = c.getContext('2d')
    const sky = g.createLinearGradient(0, 0, 0, 1080)
    sky.addColorStop(0, light ? '#7fb2e8' : '#0d1030'); sky.addColorStop(1, light ? '#f4d9b0' : '#3a2050')
    g.fillStyle = sky; g.fillRect(0, 0, 1920, 1080)
    g.fillStyle = light ? '#fff6d8' : '#e8ecff'
    g.beginPath(); g.arc(1500, 260, light ? 110 : 70, 0, 7); g.fill()
    for (const [y, col] of [[700, light ? '#5f8f5a' : '#1c1638'], [820, light ? '#3f6f45' : '#120e26']]) {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, 1080)
      for (let x = 0; x <= 1920; x += 40) g.lineTo(x, y + 60 * Math.sin(x / 170 + y))
      g.lineTo(1920, 1080); g.fill()
    }
    g.fillStyle = light ? '#ffffff' : '#ffd27a'
    for (let i = 0; i < 40; i++) g.fillRect((i * 337) % 1880, 860 + ((i * 53) % 160), 14, 18)
    return c
  }

  // Logos: red N on black, white mark on blue, green mark on white
  const logos = [['#000', '#e50914', 'N'], ['#0f79af', '#fff', '▶'], ['#fff', '#1db954', '♫'], ['#232f3e', '#ff9900', 'a']]
  const tiles = logos.map(([bg, fg, ch], i) => {
    const logo = Object.assign(document.createElement('canvas'), { width: 120, height: 120 })
    const g = logo.getContext('2d')
    g.fillStyle = bg; g.fillRect(0, 0, 120, 120)
    g.fillStyle = fg; g.font = 'bold 80px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, 60, 64)
    const tile = Object.assign(document.createElement('div'), { className: 'tile' + (i ? '' : ' focus') })
    tile.append(logo)
    $('shelf').append(tile)
    return { tile, tint: tintFrom(logo) }
  })

  let undo = []
  async function render() {
    const light = $('light').checked, baked = $('baked').checked, scale = +$('scale').value
    root.classList.toggle('light', light)
    const backdrop = scene(light)
    document.body.style.backgroundImage = `url(${backdrop.toDataURL()})`
    if (baked) root.style.setProperty('--glass-baked', `url(${await bake(backdrop, { blur: 24 })})`)

    undo.forEach(u => u()); undo = []
    const extra = el => { el.classList.toggle('glass--baked', baked); el.classList.toggle('glass--light', light) }
    const bar = document.querySelector('.bar')
    undo.push(glass(bar, { profile: 'realistic', scale })); extra(bar)
    for (const { tile, tint } of tiles) { undo.push(glass(tile, { profile: 'realistic', scale, thickness: 0.6, tint })); extra(tile) }

    $('scaleOut').value = scale
    sky()
  }

  function sky() {
    const m = +$('time').value, at = new Date(DAY + m * 60000)
    $('timeOut').value = $('clock').textContent = `${String(m / 60 | 0).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`
    glare(root, { ...YAR, viewerHeading: +$('view').value, at })
  }

  // Start state from the hash, e.g. tv.html#light&blur&time=600&view=92&scale=1
  const hash = new URLSearchParams(location.hash.slice(1))
  if (hash.has('light')) $('light').checked = true
  if (hash.has('blur')) $('baked').checked = false
  for (const id of ['time', 'view', 'scale']) if (hash.has(id)) $(id).value = hash.get(id)

  for (const id of ['baked', 'light', 'scale']) $(id).addEventListener('input', render)
  for (const id of ['time', 'view']) $(id).addEventListener('input', sky)
  render()
</script>
</body>
</html>
